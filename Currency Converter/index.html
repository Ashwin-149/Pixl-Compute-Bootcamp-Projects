<!DOCTYPE html>
<html>

  <head>
    <title>Currency Converter</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  </head>

  <body>

    <div id = "container">

        <h1 class="title">Currency Converter </h1>

        <div id="input-container">

            <p id="enter-amount">Enter Amount</p>
            <input type="number" id="amount-input" placeholder="100" required> </input>
      
        </div>

        <div id = "dropdown-container"> 

            <div id = "currency-row">

                <select id ="from-countries">
                    <option value="">Select Currency</option>
                </select>

                <label id="to-label">TO</label>

                <select id="to-countries">
                    <option value="">Select Currency</option>
                </select>

            </div>

            <button id="convert-button">Convert</button>

        </div>

        <p id= "result-label"></p>
        <p id ="error-label" hidden >An error occured. Please try again later.</p>
      
    </div>
        <script src="script.js"></script>
  </body>
</html>
